# ---------------------------------------------------------------------------
# adirafinances.com — Next.js 16 di balik nginx
#
# Pasang:
#   sudo cp deploy/nginx/adirafinances.com.conf /etc/nginx/sites-available/adirafinances.com
#   sudo ln -s /etc/nginx/sites-available/adirafinances.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat dipasang manual (bukan certbot):
#   /etc/ssl/cert_adirafinances.com.pem
#   /etc/ssl/key_adirafinances.com.key
#
# PERIKSA DULU DUA HAL SEBELUM RELOAD — keduanya kegagalan yang lazim pada
# sertifikat yang dipasang manual, dan keduanya tidak terlihat dari peramban
# desktop Anda sendiri:
#
#   1. Berkas .pem harus berisi RANTAI PENUH: sertifikat domain diikuti
#      sertifikat intermediate penerbitnya. Kalau hanya sertifikat domain,
#      peramban desktop biasanya masih menerima (karena punya cache
#      intermediate), tetapi banyak perangkat Android dan aplikasi dalam
#      aplikasi akan menolak dengan galat rantai tidak lengkap.
#         openssl crl2pkcs7 -nocrl -certfile /etc/ssl/cert_adirafinances.com.pem \
#           | openssl pkcs7 -print_certs -noout | grep -c subject=
#      Harus >= 2. Kalau 1, gabungkan: cat domain.crt intermediate.crt > cert.pem
#
#   2. Sertifikat harus mencakup KEDUA nama, apex dan www. Blok apex di bawah
#      juga menyajikan TLS sebelum mengalihkan, jadi kalau sertifikatnya hanya
#      untuk www, pengunjung yang mengetik adirafinances.com akan melihat
#      peringatan sertifikat lebih dulu — sebelum sempat dialihkan.
#         openssl x509 -in /etc/ssl/cert_adirafinances.com.pem -noout -text \
#           | grep -A1 "Subject Alternative Name"
#      Harus memuat adirafinances.com DAN www.adirafinances.com
#
#   3. Kunci privat harus hanya terbaca root:
#         sudo chmod 600 /etc/ssl/key_adirafinances.com.key
#
# Host kanonik: www.adirafinances.com
# Apex 301 ke www. Ini harus SAMA dengan `SITE_URL` di lib/site.ts — kalau
# nginx mengarahkan ke www sementara tag canonical menyebut apex, Google
# menerima dua sinyal yang bertentangan untuk halaman yang sama.
# ---------------------------------------------------------------------------

upstream adirafinances_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 1. HTTP → HTTPS, untuk kedua host
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name adirafinances.com www.adirafinances.com;

    # Biarkan certbot memperbarui sertifikat tanpa tersangkut redirect.
    # Sertifikat saat ini dipasang manual, jadi blok ini belum terpakai.
    # Dibiarkan supaya kalau nanti pindah ke Let's Encrypt, perpanjangan
    # otomatis tidak tersangkut redirect ke https di bawahnya.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.adirafinances.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. Apex → www, dalam satu lompatan
#
# Satu redirect, bukan dua. http://adirafinances.com langsung ke
# https://www.adirafinances.com — rantai redirect memboroskan crawl budget
# dan memperlambat kunjungan pertama.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adirafinances.com;

    ssl_certificate     /etc/ssl/cert_adirafinances.com.pem;
    ssl_certificate_key /etc/ssl/key_adirafinances.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSLadira:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://www.adirafinances.com$request_uri;
}

# ---------------------------------------------------------------------------
# 3. Host utama
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.adirafinances.com;

    ssl_certificate     /etc/ssl/cert_adirafinances.com.pem;
    ssl_certificate_key /etc/ssl/key_adirafinances.com.key;

    # Setelan TLS ditulis eksplisit karena tidak ada
    # /etc/letsencrypt/options-ssl-nginx.conf untuk di-include. TLS 1.0/1.1
    # sengaja tidak diaktifkan — sudah usang dan tidak dipakai peramban mana
    # pun yang masih relevan.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSLadira:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling menghemat satu perjalanan bolak-balik saat handshake
    # pertama. Hanya bekerja kalau berkas .pem memuat rantai penuh — kalau
    # tidak, nginx mencatat peringatan "ssl_stapling ignored" saat start dan
    # situsnya tetap jalan. Nyalakan setelah pemeriksaan rantai di atas lolos.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/ssl/cert_adirafinances.com.pem;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;

    access_log /var/log/nginx/adirafinances.access.log;
    error_log  /var/log/nginx/adirafinances.error.log;

    # Situs ini tidak punya unggahan; batas kecil sudah cukup.
    client_max_body_size 2m;

    # --- Header keamanan --------------------------------------------------
    # HSTS: komitmen. Sekali dikirim, peramban menolak http untuk domain ini
    # selama 2 tahun. Aktifkan setelah yakin https berjalan stabil.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # --- Kompresi ---------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml application/manifest+json;

    # --- Jangan pernah disajikan ------------------------------------------
    # Semua isi public/ tersaji di root domain. Dua folder berikut berkas
    # kerja, bukan aset situs:
    #
    #   public/template/  20 halaman HTML template SecureVest — merek pihak
    #                     lain, alamat Melbourne, testimoni dan statistik
    #                     karangan. Bisa diindeks Google kalau dibiarkan, dan
    #                     di situs YMYL itu masalah kualitas sekaligus
    #                     kredibilitas.
    #   public/analisis/  dataset cabang dan berkas analisis internal.
    #
    # Ini jaring pengaman di sisi server. Perbaikan yang sebenarnya adalah
    # memindahkan kedua folder itu KELUAR dari public/ — kalau situs ini suatu
    # saat dideploy tanpa nginx, blok ini tidak ikut terbawa.
    location ^~ /template/ { return 404; }
    location ^~ /analisis/ { return 404; }

    # Sisa berkas contoh bawaan create-next-app, tidak dipakai di mana pun.
    location = /next.svg   { return 404; }
    location = /vercel.svg { return 404; }
    location = /file.svg   { return 404; }
    location = /globe.svg  { return 404; }
    location = /window.svg { return 404; }

    # --- Aset build Next --------------------------------------------------
    # Nama berkasnya sudah mengandung hash isi, jadi aman di-cache selamanya.
    # Next sendiri sudah mengirim header immutable; ini hanya memastikan
    # nilainya tetap benar bila ada proxy lain di depan.
    location /_next/static/ {
        proxy_pass http://adirafinances_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- Aset di public/ --------------------------------------------------
    # style.css dan berkas js vendor besar TAPI namanya tidak berhash, jadi
    # tidak boleh di-cache selamanya: satu deploy dan pengunjung lama akan
    # tersangkut versi usang. Satu jam, lalu revalidasi.
    location ~* ^/(css|js|images|icons)/ {
        proxy_pass http://adirafinances_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        access_log off;
    }

    # --- Aplikasi ---------------------------------------------------------
    location / {
        proxy_pass http://adirafinances_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # App Router mengalirkan HTML sepotong-sepotong. Dengan buffering
        # menyala, nginx menahan potongan awal sampai penuh dan bagian atas
        # halaman jadi terlambat tampil.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Kalau app sedang restart saat deploy, sajikan errornya sendiri
        # daripada halaman 502 bawaan nginx.
        proxy_intercept_errors off;
    }
}

# ---------------------------------------------------------------------------
# Diperlukan oleh header Connection di atas. Taruh di /etc/nginx/nginx.conf
# dalam blok http { }, atau di /etc/nginx/conf.d/upgrade.conf:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Kalau domain ini dipindahkan ke belakang Cloudflare
#
# ‼ SSL/TLS mode WAJIB "Full (strict)". JANGAN "Flexible".
#
#   Mode Flexible membuat Cloudflare menghubungi origin lewat HTTP biasa.
#   Permintaan itu mendarat di blok :80 di atas, yang mengalihkan segalanya ke
#   https. Cloudflare mengikuti, mengirim HTTP lagi, dialihkan lagi — peramban
#   berhenti dengan ERR_TOO_MANY_REDIRECTS dan seluruh situs mati. Ini bukan
#   kemungkinan, ini kepastian dengan konfig ini.
#
#   "Full (strict)" memvalidasi sertifikat origin. Sertifikat di /etc/ssl/
#   harus terbitan CA dan mencakup kedua nama. Kalau ternyata self-signed,
#   pakai Cloudflare Origin Certificate di origin, lalu tetap Full (strict).
#
# ‼ Rocket Loader HARUS mati untuk situs ini.
#
#   Rocket Loader menunda dan menyusun ulang eksekusi <script>. app/layout.tsx
#   memuat gsap, ScrollTrigger, dan SplitText dengan strategy
#   `beforeInteractive` justru karena urutannya penting: SiteEffects menunggu
#   ketiganya ada di window sebelum memasang animasi. Menyusun ulang urutan itu
#   membuat boot animasi gagal, dan halaman bisa berhenti di keadaan
#   tersembunyi.
#
# ‼ Jangan aktifkan "Cache Everything" tanpa mengecualikan /api/.
#   Route /api/simulasi memanggil layanan simulasi Adira per permintaan.
#   Mencache-nya berarti pengunjung menerima hasil perhitungan orang lain.
#
# IP asli pengunjung
# ------------------
# Tanpa blok di bawah, setiap kunjungan tercatat dengan IP Cloudflare — log
# akses jadi tidak berguna. Daftar IP Cloudflare berubah, jadi jangan disalin
# tangan; bangkitkan berkasnya:
#
#   { for t in v4 v6; do
#       curl -s https://www.cloudflare.com/ips-$t \
#         | sed 's|^|set_real_ip_from |; s|$|;|'
#     done
#     echo 'real_ip_header CF-Connecting-IP;'
#   } | sudo tee /etc/nginx/conf.d/cloudflare-realip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Jadwalkan ulang perintah itu sesekali; Cloudflare menambah rentang baru.
# ---------------------------------------------------------------------------
